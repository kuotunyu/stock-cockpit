name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # 這個 repo 是公開的，而 .data/stock1-db.json 裡有密碼 hash、完整交易帳本與加密的券商憑證。
  # 擋住它們的目前只有一行 .gitignore——只要一次 `git add -f`，或哪天有人改壞 .gitignore，
  # 這些就會**永久公開**（git 歷史與 GitHub 快取都拿不回來）。
  #
  # 所以這裡不看 .gitignore 說什麼，直接看 `git ls-files`：版控裡實際有什麼。
  # 這道守門存在的意義正是「.gitignore 失效時還有人擋」，用它自己當依據就沒有意義了。
  # 秒級完成，所以掛在每次 push 都不心疼。
  # （檔案**內容**裡的金鑰由 GitHub 內建的 secret scanning 負責，公開 repo 預設就有。）
  no-private-data:
    name: 資料外洩守門
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Fail if private data is tracked
        run: |
          # .env.example 是刻意追蹤的範本（只有欄位名、沒有值），必須放行。
          tracked=$(git ls-files \
            | grep -Ei '^\.data(-preview)?/|^log/|^\.env($|\.)|\.(pfx|p12|pem|key)$' \
            | grep -vx '.env.example' || true)
          if [ -n "$tracked" ]; then
            echo "::error::下列私人檔案被加進版控了，這個 repo 是公開的——請先 git rm --cached 再重新提交"
            echo "$tracked" | while read -r file; do echo "::error file=$file::$file 不可進版控"; done
            exit 1
          fi
          echo "✅ 版控裡沒有 .data / .env / 憑證檔"

  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # matrix 要跟 package.json 的 engines 逐字對齊——宣稱支援卻沒測的版本，
        # 等於沒有支援（2026-08 的 fetch-timeout bug 只在 20.x／22.x 出現、24.x 完全正常，
        # 反過來也可能有只在 24.x 出現的問題被本機開發蓋掉）。
        #
        # 20.x 已於 2026-04-30 EOL（不再收安全更新），2026-08-21 一併從 engines 與這裡移除。
        # 觸發點是 jsdom 30 的 engines 是 ^22.22.2 || ^24.15.0 || >=26.0.0，Node 20 已經
        # 裝不動測試用的 jsdom；與其把 devDependency 釘在有 undici advisory 的舊版來遷就
        # 一個沒有安全更新的 runtime，不如跟著上游走。
        node-version: ["22.x", "24.x"]

    steps:
      # v4 的 action 本體跑在 Node 20 runtime 上，已被 GitHub 標為 deprecated、目前是被
      # 強制改用 Node 24 執行並每跑必噴警告（見 2025-09-19 changelog）。等 runner 撤掉這層
      # 相容墊片就會直接變成紅 X，所以先升到 action 本體即為 node24 的 v7。
      # 對本 workflow 的行為差異：checkout v7 只多擋 pull_request_target／workflow_run 的
      # fork PR checkout（我們只用 push／pull_request，無影響）；setup-node v6 把自動快取
      # 限縮到 npm（我們本來就明寫 cache: npm，無影響）。
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test
